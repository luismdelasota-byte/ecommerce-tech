# Configuracion exclusiva para TESTS

# Este archivo se usa AUTOMATICAMENTE cuando se ejecuta: mvn test
# Los tests SIEMPRE usan H2 en memoria, nunca tocan MySQL.

spring.application.name=ecommerce-tech

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# JPA / Hibernate
# create-drop = crea las tablas al iniciar el test, las borra al terminar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola H2 (opcional, util para depurar tests)
spring.h2.console.enabled=true
